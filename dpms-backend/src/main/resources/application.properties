spring.application.name=dpms-backend

# ===========================
# MySQL Database

# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/dpms_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# Hibernate / JPA
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Server
# ===========================
server.port=8080

jwt.secret=MySuperSecretKeyForDPMSApplicationAuthentication123456789
jwt.expiration=86400000

spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=uploads/profile/